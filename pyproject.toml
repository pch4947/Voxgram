[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxgram"
version = "0.1.0"
description = "Voice reconstruction from printed spectrogram images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "librosa==0.11.0",
    "soundfile",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
playback = [
    "sounddevice",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
